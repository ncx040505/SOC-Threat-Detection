paths:
  raw_dir: /Users/ncx/Desktop/SOC-Threat-Detection/data
  processed_dir: /Users/ncx/Desktop/SOC-Threat-Detection/data/processed
  split_dir: /Users/ncx/Desktop/SOC-Threat-Detection/data/splits
  model_dir: /Users/ncx/Desktop/SOC-Threat-Detection/models
  output_dir: /Users/ncx/Desktop/SOC-Threat-Detection/outputs
  viz_dir: /Users/ncx/Desktop/SOC-Threat-Detection/visualizations
  log_dir: /Users/ncx/Desktop/SOC-Threat-Detection/logs
columns:
  id_cols:
  - event_id
  - message_sanitized
  label_col: label
  text_col: message_sanitized
data:
  train_file: train.parquet
  test_file: valid_input.parquet
  label_col: label
  id_cols:
  - event_id
  - message_sanitized
  label_mapping:
    benign: 0
    malicious: 1
    suspicious: 2
  reverse_label_mapping:
    0: benign
    1: malicious
    2: suspicious
  drop_cols: []
  test_size: 0.2
  val_size: 0.15
  random_state: 42
  missing_threshold: 0.6
  categorical_threshold: 300
  large_dataset: true
features:
  numeric_strategy: robust
  target_encoding:
    enabled: true
    cols: []
    smooth: 10
  text_feature:
    enabled: true
    max_features: 5000
    ngram_range:
    - 1
    - 4
    analyzer: char_wb
    min_df: 3
  interaction_features: true
  interaction_top_k: 100
  feature_selection:
    enabled: false
    method: select_from_model
    max_features: 300
    model: random_forest
    threshold: mean
imbalance:
  method: hybrid
  hybrid:
    under_sampling_strategy:
      0: 50000
    over_sampling_strategy:
      1: 30000
      2: 30000
  random_state: 42
models:
  enabled:
  - random_forest
  - xgboost
  - lightgbm
  - mlp
  random_forest:
    n_estimators: 200
    max_depth: 20
    min_samples_split: 10
    min_samples_leaf: 4
    class_weight: balanced
    n_jobs: -1
    random_state: 42
  xgboost:
    n_estimators: 200
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: mlogloss
    tree_method: hist
    random_state: 42
  lightgbm:
    n_estimators: 300
    max_depth: 10
    learning_rate: 0.05
    num_leaves: 63
    subsample: 0.8
    colsample_bytree: 0.8
    class_weight: balanced
    metric: multi_logloss
    boosting_type: gbdt
    random_state: 42
    n_jobs: -1
  mlp:
    hidden_layers:
    - 256
    - 128
    - 64
    activation: relu
    batch_size: 256
    learning_rate: 0.001
    epochs: 200
    early_stopping_patience: 15
stacking:
  enabled: true
  final_estimator: logistic
  cv: 5
  stack_method: predict_proba
  passthrough: true
hyperopt:
  enabled: false
  n_trials: 50
  cv_folds: 3
  timeout: 3600
  n_jobs: 1
  metric: f1_macro
incremental:
  enabled: false
  model: mlp
  batch_size: 1000
  epochs_per_batch: 5
  validation_fraction: 0.1
training:
  cv_folds: 5
  primary_metric: f1_macro
  random_state: 42
  early_stopping_rounds: 50
explainability:
  enabled: true
  methods:
  - shap_tree
  - permutation
  shap_sample_size: 2000
  top_features: 30
prediction:
  output_file: res.csv
  use_ensemble: true
  output_probabilities: false
logging:
  level: INFO
  format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
version: 2.0.0
